# Expected equilibria of instance B (data/ms2002_instance_b.toml). NOT from the paper:
# neither edition publishes numbers (FINDINGS.md F-0001, F-0002). Derived in
# docs/ms2002_instance_b_derivation.md by applying the paper's equilibrium conditions --
# (2)-(3) on p.14 for the competitive case, (5)-(6) on p.16 for the open-loop Cournot case --
# to the segment regime that exhaustive enumeration identifies, and checked by substitution.
# Exact values are rational and are written as fractions in the derivation; the decimals
# here are their Float64 values. Units as in the instance file: GW, $/MWh.
#
# `tolerance` is the absolute tolerance at which a solver's point is declared to be this
# equilibrium. Quantities are O(1-10) GW and prices O(10-100) $/MWh; PATH and CCOpt both
# land within 3e-7 of the exact point, and the nearest wrong regime is O(0.1) away.

tolerance = 1e-5

[competitive]
x_p = 1.6
x_b = 8.0
y_p = [1.6, 0.5, 0.0, 0.0]
y_b = [8.0, 8.0, 8.0, 7.2]
lambda_p = [24.0, 0.0, 0.0, 0.0]
lambda_b = [36.0, 12.0, 2.0, 0.0]
price = [54.0, 30.0, 20.0, 18.0]
segment_types = ["a", "c", "e", "d"]   # partition (13), p.22; see segment_type

[open_loop_cournot]
x_p = 3.2944444444444443      # 593/180
x_b = 3.011111111111111       # 271/90
y_p = [3.2944444444444443, 2.7444444444444445, 1.9944444444444445, 1.6]   # 593/180, 247/90, 359/180, 8/5
y_b = [3.011111111111111, 3.011111111111111, 3.011111111111111, 2.8]      # 271/90 x3, 14/5
lambda_p = [24.0, 0.0, 0.0, 0.0]
lambda_b = [38.833333333333336, 9.333333333333334, 1.8333333333333333, 0.0]   # 233/6, 28/3, 11/6, 0
price = [86.94444444444444, 57.44444444444444, 49.94444444444444, 46.0]     # 1565/18, 517/9, 899/18, 46
segment_types = ["a", "c", "c", "b"]

# The closed-loop Cournot equilibrium of section 6. NOT hand-derived, unlike the two above:
# found by `enumerate_closed_loop` and verified by a recomputed residual of equation (16),
# a global best-response scan, and the paper's comparative theorems. See DECISIONS.md
# D-0006 and FINDINGS.md F-0013.
[closed_loop_cournot]
x_p = 3.03
x_b = 3.54
y_p = [3.03, 2.48, 1.9333333333333333, 1.6]           # 3.03, 2.48, 29/15, 8/5
y_b = [3.54, 3.54, 3.1333333333333333, 2.8]           # 3.54, 3.54, 47/15, 14/5
lambda_p = [24.0, 0.0, 0.0, 0.0]
lambda_b = [30.9, 1.4, 0.0, 0.0]
price = [84.3, 54.8, 49.333333333333336, 46.0]        # 84.3, 54.8, 148/3, 46
segment_types = ["a", "c", "b", "b"]
