# CCOpt.jl's formatter settings, copied from its repository root (last changed there in f3d8ab5) so that
# scripts/emit_upstream_test.jl formats the files beside it the way CCOpt.jl's pre-commit hook would.

# Configuration file for JuliaFormatter.jl
